[package]
name = "tnsr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bumpalo = { version = "3.14", features = ["collections", "boxed"] }
itertools = "0.14.0"
lazy_static = "1.5.0"
petgraph = "0.8.3"
tracing = "0.1.41"
tracing-chrome = "0.7.2"
tracing-subscriber = "0.3.18"
cudarc = { version = "0.17.3", features = ["cuda-12090"], optional = true }
rayon = { version = "1.11", optional = true }
egg = "0.10.0"
half = { version = "2.4", features = ["num-traits"] }
num-traits = "0.2"

[features]
default = ["parallel"]
cuda = ["cudarc"]
fusion = []
parallel = ["rayon"]
# Use PTX JIT executor (tiled) instead of static CUDA kernels
# Only meaningful when cuda feature is enabled
ptx = []

[[bench]]
name = "cpu"
harness = false

[[bench]]
name = "gpu"
harness = false
required-features = ["cuda"]

[dev-dependencies]
clap = { version = "4.3.7", features = ["derive"] }
criterion = "0.7.0"
flate2 = "1.1.5"
mnist = "0.6.0"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rstest = "0.26.1"
stats_alloc = "0.1.10"
test-log = "0.2.18"

[package]
name = "nn"
version = "0.1.0"
edition = "2024"

[dependencies]
tensor = { path = "../tensor" }
rand = { version = "0.9.2", features = ["std_rng"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[features]
default = []
cuda = ["runtime/cuda"]

[dev-dependencies]
runtime = { path = "../runtime" }
candle-datasets = "0.9"
